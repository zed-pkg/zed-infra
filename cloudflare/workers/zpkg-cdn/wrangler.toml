# zpkg-cdn — the public read path to the artifact bucket.
#
# Deployed both at `cdn.zpkg.net` and at its `workers.dev` hostname, and the
# second one is not a convenience. `cdn.zpkg.net` and `registry.zpkg.net` share
# the zpkg.net zone, so a zone-level failure takes both down together; the
# workers.dev hostname resolves through a zone we do not own and cannot
# misconfigure. A fallback inside the failure domain of the thing it backs up
# is not a fallback.

name = "zpkg-cdn"
main = "src/worker.js"
compatibility_date = "2026-08-01"

# On, deliberately. This is the survives-everything hostname; turning it off to
# tidy up the dashboard would quietly delete the property this Worker exists
# for. The hostname is zpkg-cdn.alexander-d-mills.workers.dev — the subdomain
# is per *account*, not per org, and the org-shaped guess this file carried
# before the first real deploy (zed-pkg.workers.dev) did not resolve.
workers_dev = true

[[r2_buckets]]
binding = "ARTIFACTS"
bucket_name = "zed-pkg-artifacts"

[vars]
REGISTRY_URL = "https://registry.zpkg.net"
# Served at /.well-known/zpkg-mirrors.json. Static rather than read from the
# bucket, so it answers even when R2 is the broken thing.
MIRRORS = '''[
  {
    "kind": "object-store",
    "id": "zpkg-cdn",
    "url": "https://cdn.zpkg.net",
    "alternate_urls": ["https://zpkg-cdn.alexander-d-mills.workers.dev"],
    "priority": 20
  },
  {
    "kind": "zed-registry",
    "id": "zpkg-registry",
    "url": "https://registry.zpkg.net",
    "priority": 0
  }
]'''

[[routes]]
pattern = "cdn.zpkg.net/*"
zone_name = "zpkg.net"

[env.dev]
name = "zpkg-cdn-dev"
workers_dev = true

[[env.dev.r2_buckets]]
binding = "ARTIFACTS"
bucket_name = "zed-pkg-artifacts-dev"

[env.dev.vars]
REGISTRY_URL = "http://localhost:8080"
MIRRORS = "[]"
