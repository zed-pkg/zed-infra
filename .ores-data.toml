# Governed data-platform declaration for Zed Package Registry.
# Shared contract authority: ores-data-platform/ores-dp-interfaces@ef0b19df1736ad6dcd8aaf2fa1be78c8b28e53e2
# Desired dataflow only: no provider credentials, stream creation, or cloud/database apply occurs here.

[platform]
version = 1
profile = "standard"
owner = "zed-pkg"
event_bus = "nats-jetstream"
table_format = "iceberg"
default_privacy = "internal"
default_retention = { class = "standard", days = 400, legal_hold = false }

# Package lifecycle and registry metadata.
[[pipeline]]
name = "package-events-bronze"
owner = "zed-pkg"
mode = "streaming"
engine = "rust"
replayable = true
source = { kind = "nats-jetstream", subject = "ores.dp.zed-pkg.packages.*.v1", partition_key = "packageId", contract = "PackageEvent@1" }
sink = { tier = "bronze", format = "jsonl", dataset = "zed.package_events_raw", contract = "PackageEvent@1", privacy = "none", retention = { class = "standard", days = 400 } }
quality = { reject_unknown_schema = true, require_event_id = true, require_event_time = true, require_idempotency_key = true, require_privacy_classification = true }
lineage = { enabled = true, standard = "openlineage" }

[[pipeline]]
name = "package-events-silver"
owner = "zed-pkg"
mode = "microbatch"
engine = "duckdb"
replayable = true
source = { kind = "object-storage", dataset = "zed.package_events_raw", partition_key = "packageId", contract = "PackageEvent@1" }
sink = { tier = "silver", format = "iceberg", dataset = "zed.package_events", contract = "PackageEvent@1", privacy = "none", retention = { class = "long", days = 2555 } }
quality = { reject_unknown_schema = true, require_event_id = true, require_event_time = true, require_idempotency_key = true, require_privacy_classification = true }
lineage = { enabled = true, standard = "openlineage" }

[[pipeline]]
name = "package-adoption-gold"
owner = "zed-pkg"
mode = "batch"
engine = "sql"
replayable = true
source = { kind = "object-storage", dataset = "zed.package_events", contract = "PackageEvent@1" }
sink = { tier = "gold", format = "iceberg", dataset = "zed.package_adoption_daily", contract = "PackageAdoptionDaily@1", privacy = "none", retention = { class = "long", days = 2555 } }
quality = { reject_unknown_schema = true, require_event_id = true, require_event_time = true, require_idempotency_key = true, require_privacy_classification = true }
lineage = { enabled = true, standard = "openlineage" }

