name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  terraform-fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
      - run: terraform fmt -check -recursive terraform/

  kustomize-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build overlays
        run: |
          set -euo pipefail
          for overlay in k8s/manifests/*/overlays/*; do
            echo "== $overlay =="
            kubectl kustomize "$overlay" >/dev/null
          done

  yaml-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate manifest and workflow YAML syntax
        run: |
          python3 - <<'PY'
          import glob
          import sys
          import yaml

          files = sorted(
              glob.glob("k8s/**/*.yaml", recursive=True)
              + glob.glob(".github/workflows/*.yml")
              + glob.glob(".github/workflows/*.yaml")
          )
          bad = 0
          for path in files:
              try:
                  with open(path, encoding="utf-8") as handle:
                      list(yaml.safe_load_all(handle))
              except Exception as exc:
                  print(f"{path}: {exc}")
                  bad += 1
          print(f"validated {len(files)} YAML files")
          sys.exit(1 if bad else 0)
          PY

  preflight-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test Zed cloud preflight failure and cleanup paths
        run: bash scripts/test-zed-cloud-preflight.sh

  image-resolver-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Test immutable image label, digest, and token contracts
        run: bash scripts/test-resolve-zed-images.sh
