name: deploy Cloudflare Workers

on:
  push:
    branches: [main]
    paths:
      - 'workers/**'
      - '.github/workflows/deploy-cloudflare-workers.yml'
  workflow_dispatch:

concurrency:
  group: zpkg-cloudflare-workers-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_WORKERS_DEPLOY_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v6.0.0
        with:
          node-version: "24.19.0"

      - name: Require the scoped Cloudflare deployment identity
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_ACCOUNT_ID}" || {
            echo "CLOUDFLARE_ACCOUNT_ID repository variable is not configured" >&2
            exit 1
          }
          test -n "${CLOUDFLARE_API_TOKEN}" || {
            echo "CLOUDFLARE_WORKERS_DEPLOY_TOKEN repository secret is not configured" >&2
            exit 1
          }

      - name: Install and audit the locked Worker test runtime
        run: |
          npm ci --ignore-scripts --prefix workers
          npm audit --audit-level=low --prefix workers

      - name: Prove edge contracts before deployment
        run: npm test --prefix workers

      - name: Read, lease, and deploy every canonical Worker
        working-directory: workers
        run: |
          set -euo pipefail

          deploy_one() {
            local config="$1"
            local worker="$2"
            local snapshot
            local modified_on
            local deploy_status=0
            local release_status=0

            snapshot="$(node scripts/cf-lease.mjs snapshot --worker "${worker}")"
            modified_on="$(
              node -e '
                const fs = require("node:fs");
                const snapshot = JSON.parse(fs.readFileSync(0, "utf8"));
                process.stdout.write(snapshot.live?.modified_on || "");
              ' <<<"${snapshot}"
            )"

            if [ -n "${modified_on}" ]; then
              node scripts/cf-lease.mjs acquire \
                --worker "${worker}" \
                --if-match "${modified_on}"
            else
              node scripts/cf-lease.mjs acquire \
                --worker "${worker}" \
                --create-missing
            fi

            npx --yes wrangler@4.129.1 deploy \
              --env="" \
              --config "${config}/wrangler.toml" || deploy_status=$?
            node scripts/cf-lease.mjs release \
              --worker "${worker}" || release_status=$?

            if [ "${deploy_status}" -ne 0 ]; then
              return "${deploy_status}"
            fi
            return "${release_status}"
          }

          deploy_one app-proxy zpkg-app-proxy
          deploy_one user-proxy zpkg-user-proxy
          deploy_one web-proxy zpkg-web-proxy
          deploy_one api-proxy zpkg-api-proxy
          deploy_one registry-proxy zpkg-registry-proxy
          deploy_one org-proxy zpkg-org-proxy
          deploy_one cdn-proxy zpkg-cdn

      # The Worker's secrets are made *equal* to what this repository declares,
      # not merely topped up. A sync that only writes cannot take access away:
      # deleting EDGE_PUBLISH_TOKEN here would otherwise leave the old
      # credential live on the Worker with the write path still open. Absent or
      # empty means revoked, and a revocation that fails fails the deploy.
      #
      # Values reach the script through the environment only; it never logs
      # them and never puts them in argv. The reviewed EDGE_PUBLISH_ENABLED
      # flag in wrangler.toml is the second, independent switch.
      - name: Reconcile registry edge secrets
        working-directory: workers
        env:
          EDGE_PUBLISH_TOKEN: ${{ secrets.EDGE_PUBLISH_TOKEN }}
          GITHUB_PACKAGES_TOKEN: ${{ secrets.ZPKG_GITHUB_PACKAGES_TOKEN }}
        run: node scripts/sync-worker-secrets.mjs zpkg-registry-proxy

      - name: Verify the app route no longer leaks the origin placeholder
        run: |
          set -euo pipefail
          headers="${RUNNER_TEMP}/app-zpkg-net.headers"
          body="${RUNNER_TEMP}/app-zpkg-net.html"

          timeout --foreground 15s getent ahosts app.zpkg.net >/dev/null || {
            echo "app.zpkg.net did not resolve within 15 seconds" >&2
            exit 1
          }

          status="$(
            timeout --foreground 120s \
              curl -sS --connect-timeout 5 --max-time 30 \
                --retry 3 --retry-all-errors --retry-delay 2 --retry-max-time 90 \
                -H 'Accept: text/html' \
                -D "${headers}" \
                -o "${body}" \
                -w '%{http_code}' \
                https://app.zpkg.net/
          )" || {
            code=$?
            echo "app.zpkg.net smoke request failed or exceeded the 120-second process deadline (exit ${code})" >&2
            exit "${code}"
          }

          case "${status}" in
            200|301|302|303|307|308)
              echo "app.zpkg.net origin is serving HTTP ${status}"
              ;;
            503)
              grep -qi '^retry-after: 7200' "${headers}"
              grep -qi 'come back in about two hours' "${body}"
              echo "app.zpkg.net is serving the reviewed maintenance fallback"
              ;;
            *)
              echo "app.zpkg.net returned unexpected HTTP ${status}" >&2
              exit 1
              ;;
          esac
          grep -qi '^x-zed-edge: app.zpkg.net' "${headers}"

      - name: Verify typed API outages and bounded organization login
        run: |
          set -euo pipefail

          for host in api.zpkg.net org.zpkg.net; do
            timeout --foreground 15s getent ahosts "${host}" >/dev/null || {
              echo "${host} did not resolve within 15 seconds" >&2
              exit 1
            }
          done

          api_headers="${RUNNER_TEMP}/api-zpkg-net.headers"
          api_body="${RUNNER_TEMP}/api-zpkg-net.json"
          api_status="$(
            timeout --foreground 120s \
              curl -sS --connect-timeout 5 --max-time 30 \
                --retry 8 --retry-all-errors --retry-delay 3 --retry-max-time 90 \
                -H 'Accept: application/json' \
                -D "${api_headers}" \
                -o "${api_body}" \
                -w '%{http_code}' \
                https://api.zpkg.net/healthz
          )" || {
            code=$?
            echo "api.zpkg.net smoke request failed or exceeded the 120-second process deadline (exit ${code})" >&2
            exit "${code}"
          }
          grep -qi '^x-zed-edge: api.zpkg.net' "${api_headers}"
          case "${api_status}" in
            200)
              echo "api.zpkg.net origin is healthy behind the Worker"
              ;;
            503)
              jq -e '.ok == false and .host == "api.zpkg.net"' "${api_body}" >/dev/null
              echo "api.zpkg.net is serving the reviewed typed outage response"
              ;;
            *)
              echo "api.zpkg.net returned unexpected HTTP ${api_status}" >&2
              exit 1
              ;;
          esac

          org_headers="${RUNNER_TEMP}/org-zpkg-net.headers"
          org_status="$(
            timeout --foreground 120s \
              curl -sS --connect-timeout 5 --max-time 30 \
                --retry 8 --retry-all-errors --retry-delay 5 --retry-max-time 90 \
                -D "${org_headers}" \
                -o /dev/null \
                -w '%{http_code}' \
                'https://org.zpkg.net/login?org=zed-pkg-test'
          )" || {
            code=$?
            echo "org.zpkg.net smoke request failed or exceeded the 120-second process deadline (exit ${code})" >&2
            exit "${code}"
          }
          test "${org_status}" = 302
          grep -qi '^x-zed-edge: org.zpkg.net' "${org_headers}"
          grep -q '^location: https://app.zpkg.net/auth/sign-in?return_to=%2Forgs%2Fzed-pkg-test' "${org_headers}"
          echo "org.zpkg.net is serving the bounded organization-login redirect"

      - name: Verify public registry metadata and CDN bytes through the edge
        env:
          CANARY_ORG: zed-pkg-test
          CANARY_REPO: github-api-fallback-canary
          CANARY_PACKAGE: github-api-fallback-canary
          CANARY_VERSION: 0.0.2
        run: |
          set -euo pipefail
          root="${RUNNER_TEMP}/zed-public-fallback"
          mkdir -p "${root}"

          for host in registry.zpkg.net cdn.zpkg.net github.com; do
            timeout --foreground 15s getent ahosts "${host}" >/dev/null || {
              echo "${host} did not resolve within 15 seconds" >&2
              exit 1
            }
          done

          tag="v${CANARY_VERSION}"
          asset="zpkg-${CANARY_ORG}-${CANARY_PACKAGE}-${CANARY_VERSION}.tar.gz"
          sidecar="zpkg-${CANARY_ORG}-${CANARY_PACKAGE}-${CANARY_VERSION}.json"
          github_release="https://github.com/${CANARY_ORG}/${CANARY_REPO}/releases/download/${tag}"
          registry_url="https://registry.zpkg.net/v1/packages/${CANARY_ORG}/${CANARY_PACKAGE}/versions/${CANARY_VERSION}"
          cdn_url="https://cdn.zpkg.net/github/${CANARY_ORG}/${CANARY_REPO}/${tag}/${asset}"

          timeout --foreground 120s \
            curl -fsSL --connect-timeout 5 --max-time 30 \
              --retry 8 --retry-all-errors --retry-max-time 90 \
              -H 'Accept: application/json' \
              "${github_release}/${sidecar}" \
              -o "${root}/github-sidecar.json"
          timeout --foreground 120s \
            curl -fsSL --connect-timeout 5 --max-time 30 \
              --retry 8 --retry-all-errors --retry-max-time 90 \
              "${github_release}/${asset}" \
              -o "${root}/github-asset.tar.gz"

          registry_status="$(
            timeout --foreground 120s \
              curl -sS --connect-timeout 5 --max-time 30 \
                --retry 8 --retry-all-errors --retry-max-time 90 \
                -H 'Accept: application/json' \
                -D "${root}/registry.headers" \
                -o "${root}/registry.json" \
                -w '%{http_code}' \
                "${registry_url}"
          )" || {
            code=$?
            echo "registry.zpkg.net smoke request failed or exceeded the 120-second process deadline (exit ${code})" >&2
            exit "${code}"
          }
          test "${registry_status}" = 200 || {
            echo "registry fallback returned HTTP ${registry_status}" >&2
            head -n 40 "${root}/registry.headers" >&2
            head -n 80 "${root}/registry.json" >&2
            exit 1
          }
          grep -qi '^x-zed-edge: registry' "${root}/registry.headers"
          grep -qi '^x-zed-source: github-public' "${root}/registry.headers"

          cdn_status="$(
            timeout --foreground 120s \
              curl -sS --connect-timeout 5 --max-time 30 \
                --retry 8 --retry-all-errors --retry-max-time 90 \
                -D "${root}/cdn.headers" \
                -o "${root}/cdn-asset.tar.gz" \
                -w '%{http_code}' \
                "${cdn_url}"
          )" || {
            code=$?
            echo "cdn.zpkg.net smoke request failed or exceeded the 120-second process deadline (exit ${code})" >&2
            exit "${code}"
          }
          test "${cdn_status}" = 200 || {
            echo "CDN fallback returned HTTP ${cdn_status}" >&2
            head -n 40 "${root}/cdn.headers" >&2
            exit 1
          }
          grep -qi '^x-zed-edge: cdn' "${root}/cdn.headers"
          grep -qi '^x-zed-source: github-release' "${root}/cdn.headers"
          grep -qi '^cache-control: .*immutable' "${root}/cdn.headers"

          python3 - "${root}" "${github_release}/${asset}" <<'PY'
          import hashlib
          import json
          import pathlib
          import sys

          root = pathlib.Path(sys.argv[1])
          direct_url = sys.argv[2]
          expected = json.loads((root / "github-sidecar.json").read_text())
          actual = json.loads((root / "registry.json").read_text())
          direct = (root / "github-asset.tar.gz").read_bytes()
          proxied = (root / "cdn-asset.tar.gz").read_bytes()
          digest = hashlib.sha256(direct).hexdigest()

          assert direct == proxied, "Cloudflare CDN bytes differ from GitHub"
          assert expected["sha256"] == digest
          assert expected["size"] == len(direct)
          assert expected["download_url"] == direct_url
          for key in ("org", "name", "version", "sha256", "size", "download_url"):
              assert actual[key] == expected[key], (key, actual[key], expected[key])
          print(
              json.dumps(
                  {
                      "ok": True,
                      "sha256": digest,
                      "bytes": len(direct),
                      "registry": actual,
                  },
                  indent=2,
              )
          )
          PY
