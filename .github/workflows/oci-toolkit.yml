name: OCI toolkit contract

on:
  pull_request:
    paths:
      - "docker/**"
      - "docs/OCI_IMAGES.md"
      - "scripts/oci/**"
      - ".github/workflows/oci-toolkit.yml"
  push:
    branches: [main]
    paths:
      - "docker/**"
      - "docs/OCI_IMAGES.md"
      - "scripts/oci/**"
      - ".github/workflows/oci-toolkit.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Parse shell entrypoints
        run: bash -n scripts/oci/build-and-push.sh scripts/oci/test-build-and-push.sh
      - name: Exercise fail-closed publication contract
        run: bash scripts/oci/test-build-and-push.sh
