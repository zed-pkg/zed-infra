name: Validate zed-pkg account infrastructure

on:
  pull_request:
    paths:
      - "k8s/zed-pkg-account/**"
      - "k8s/overlays/k8s-cluster/**"
      - "terraform/modules/shared-auth-rds/**"
      - ".github/workflows/account-registry-validate.yml"
  push:
    branches: [main]
    paths:
      - "k8s/zed-pkg-account/**"
      - "k8s/overlays/k8s-cluster/**"
      - "terraform/modules/shared-auth-rds/**"
      - ".github/workflows/account-registry-validate.yml"

permissions:
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - name: Check formatting
        run: terraform fmt -check -recursive terraform/modules/shared-auth-rds
      - name: Initialize module without a backend
        run: terraform -chdir=terraform/modules/shared-auth-rds init -backend=false -input=false
      - name: Validate module
        run: terraform -chdir=terraform/modules/shared-auth-rds validate

  kubernetes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2
        with:
          persist-credentials: false
      - uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4.0.1
        with:
          version: latest
      - name: Render portable base and k8s-cluster overlay
        run: |
          kubectl kustomize k8s/zed-pkg-account > /tmp/zed-pkg-account.yaml
          kubectl kustomize k8s/overlays/k8s-cluster > /tmp/zed-pkg-cluster.yaml
      - name: Enforce portable migration and secret boundaries
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -c '^kind: Namespace$' /tmp/zed-pkg-account.yaml)" -eq 1
          test "$(grep -c '^kind: Job$' /tmp/zed-pkg-account.yaml)" -eq 1
          test "$(grep -c '^kind: Deployment$' /tmp/zed-pkg-account.yaml)" -eq 2
          grep -q 'argocd.argoproj.io/hook: PreSync' /tmp/zed-pkg-account.yaml
          grep -q 'AUTO_MIGRATE: "false"' /tmp/zed-pkg-account.yaml
          grep -q 'replace-with-git-sha' /tmp/zed-pkg-account.yaml
          if grep -q '^kind: Secret$' /tmp/zed-pkg-account.yaml; then
            echo 'Plain Kubernetes Secret manifests are prohibited in this base.' >&2
            exit 1
          fi
          test "$(grep -c 'image: ghcr.io/zed-pkg/zed-api-server.rs:' /tmp/zed-pkg-account.yaml)" -eq 2
          api_images="$(grep 'image: ghcr.io/zed-pkg/zed-api-server.rs:' /tmp/zed-pkg-account.yaml | awk '{$1=$1};1' | sort -u)"
          test "$(printf '%s\n' "$api_images" | grep -c .)" -eq 1
      - name: Enforce the strict k8s-cluster tenant and public hosts
        shell: bash
        run: |
          set -euo pipefail
          if grep -q '^kind: Namespace$' /tmp/zed-pkg-cluster.yaml; then
            echo 'The k8s-cluster overlay must not create a cluster-scoped Namespace.' >&2
            exit 1
          fi
          if grep -q 'namespace: zed-pkg' /tmp/zed-pkg-cluster.yaml; then
            echo 'The k8s-cluster overlay must use the existing zed tenant.' >&2
            exit 1
          fi
          grep -q 'namespace: zed' /tmp/zed-pkg-cluster.yaml
          grep -Eq 'ZED_API_URL: .*zed-api-server\.zed\.svc\.cluster\.local:8080' /tmp/zed-pkg-cluster.yaml
          grep -q 'host: app.zpkg.net' /tmp/zed-pkg-cluster.yaml
          grep -q 'host: api.zpkg.net' /tmp/zed-pkg-cluster.yaml
          grep -q 'secretName: zed-pkg-public-tls' /tmp/zed-pkg-cluster.yaml
          grep -q 'ingressClassName: nginx' /tmp/zed-pkg-cluster.yaml
          test "$(grep -c '^kind: Ingress$' /tmp/zed-pkg-cluster.yaml)" -eq 1
          test "$(grep -c '^kind: Job$' /tmp/zed-pkg-cluster.yaml)" -eq 1
          test "$(grep -c '^kind: Deployment$' /tmp/zed-pkg-cluster.yaml)" -eq 2
          if grep -q '^kind: Secret$' /tmp/zed-pkg-cluster.yaml; then
            echo 'Plain Kubernetes Secret manifests are prohibited in the cluster overlay.' >&2
            exit 1
          fi
          test "$(grep -c 'image: ghcr.io/zed-pkg/zed-api-server.rs:' /tmp/zed-pkg-cluster.yaml)" -eq 2
          api_images="$(grep 'image: ghcr.io/zed-pkg/zed-api-server.rs:' /tmp/zed-pkg-cluster.yaml | awk '{$1=$1};1' | sort -u)"
          test "$(printf '%s\n' "$api_images" | grep -c .)" -eq 1
