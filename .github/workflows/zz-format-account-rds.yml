name: format account RDS module

on:
  push:
    branches:
      - feat/account-registry-k8s-runtime
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: format-account-rds-module
  cancel-in-progress: false

jobs:
  format-validate-and-commit:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out exact feature head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_wrapper: false

      - name: Canonically format and validate
        shell: bash
        run: |
          set -euo pipefail
          terraform fmt -recursive terraform/modules/shared-auth-rds
          terraform -chdir=terraform/modules/shared-auth-rds init -backend=false -input=false
          terraform -chdir=terraform/modules/shared-auth-rds validate
          rm .github/workflows/zz-format-account-rds.yml
          git diff --check

      - name: Commit the exact validated result
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          if git diff --cached --quiet; then
            echo 'No formatting patch was required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'style(DEN-2788): apply canonical Terraform formatting'
          git push origin HEAD:feat/account-registry-k8s-runtime
