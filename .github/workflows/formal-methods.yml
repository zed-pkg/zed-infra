name: Formal edge handshake safety

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: formal-edge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  handshake-safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      # Public immutable incubator export of fmctl; forks need no private
      # repository credential. Also validated locally with the standalone
      # ORESoftware/formal-methods.rs runner (see formal/README.md).
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: opto-sync/opto-sync-clients
          ref: c2146ef9f054d24e1488c216547852aa148285cf
          path: formal-tools
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: '1.95.0'
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v6
        with:
          node-version: '24.19.0'
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: formal-tools/tools/fmctl
      - name: Build the pinned Rust verification runner
        run: cargo build --locked --manifest-path formal-tools/tools/fmctl/Cargo.toml --bin fmctl
      - name: Verify the model, production replay, and negative controls
        run: node formal/check.mjs "$GITHUB_WORKSPACE/formal-tools/tools/fmctl/target/debug/fmctl"
      - name: Upload bounded proof and counterexample evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: edge-handshake-formal-evidence
          path: |
            formal/
            .formal-artifacts/fmctl/*.json
            .formal-artifacts/fmctl/*.log
            .formal-artifacts/*.itf.json
            .formal-artifacts/negative-controls/*.json
            .formal-artifacts/negative-controls/*.qnt
            .formal-artifacts/negative-controls/*.toml
            .formal-artifacts/negative-controls/verification/fmctl/*.json
            .formal-artifacts/negative-controls/verification/fmctl/*.log
            .formal-artifacts/negative-controls/adapter/fmctl/*.json
            .formal-artifacts/negative-controls/adapter/fmctl/*.log
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
