name: ores-chat API modernization proof
on:
  push:
    branches: [proof/ores-chat-modernization-20260923]
    paths-ignore: [.proof/api-generation.log]
permissions:
  contents: write
jobs:
  api:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
      ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
      API_DIR: ores-chat-api-server.rs
    steps:
      - name: Check out proof repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: proof/ores-chat-modernization-20260923
          path: proof-repo
      - name: Require sanctioned cross-org source credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "${ORE_SOURCE_PAT:-}"
      - name: Check out exact ORES Chat API branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ores-chat/ores-chat-api-server.rs
          ref: chatgpt/api-transport-generation-20260922
          token: ${{ secrets.ORE_SOURCE_PAT }}
          path: ores-chat-api-server.rs
          fetch-depth: 0
      - name: Check out exact ores-stack authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ORESoftware/ores-stack
          ref: d46c07e0f91c2dbda9b2fee64bdd82f6d52fc1ef
          token: ${{ secrets.ORE_SOURCE_PAT }}
          path: ores-stack
          persist-credentials: false
      - name: Configure private Git/Cargo source access
        shell: bash
        run: |
          set -euo pipefail
          git config --global url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf "https://github.com/"
      - name: Install current ores-stack authority
        shell: bash
        run: cargo install --path ores-stack/crates/ores-stack-cli --locked
      - name: Mount semantic transport modules and retire legacy public handler
        working-directory: ores-chat-api-server.rs
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('src/lib.rs')
          text = path.read_text()
          if 'pub mod graphql;' not in text:
              text = text.replace('pub mod sidecar;\n', 'pub mod graphql;\npub mod routes;\npub mod sidecar;\n', 1)
          text = text.replace(
              'post(public_chat).options(public_preflight)',
              'post(routes::rest::v1::public_chat::route::post).options(public_preflight)',
              1,
          )
          start = text.find('\nasync fn public_chat(\n')
          end = text.find('\nasync fn customer_chat(\n', start + 1) if start >= 0 else -1
          if start >= 0:
              if end < 0:
                  raise SystemExit('found legacy public_chat but not customer_chat boundary')
              text = text[:start] + '\n' + text[end:]
          if 'post(public_chat)' in text or '\nasync fn public_chat(\n' in text:
              raise SystemExit('legacy public chat authority still present')
          path.write_text(text)
          PY
      - name: Generate RPC, route-map and provider-neutral API Lambda source
        id: generate
        shell: bash
        run: |
          set +e
          ores-stack generate all --roots="$(pwd)/${API_DIR}" > /tmp/api-generation.log 2>&1
          status=$?
          cat /tmp/api-generation.log
          if [ "$status" -ne 0 ]; then
            mkdir -p proof-repo/.proof
            cp /tmp/api-generation.log proof-repo/.proof/api-generation.log
            exit "$status"
          fi
          set -e
          ores-stack generate all --roots="$(pwd)/${API_DIR}" --check
      - name: Persist generator failure diagnostic
        if: ${{ failure() && steps.generate.conclusion == 'failure' }}
        working-directory: proof-repo
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .proof/api-generation.log
          git commit -m 'test: retain ores-chat generator failure diagnostic'
          git push origin HEAD:proof/ores-chat-modernization-20260923
      - name: Regenerate Rust lock from exact private sources
        working-directory: ores-chat-api-server.rs
        run: cargo generate-lockfile
      - name: Format and compile exact generated branch
        working-directory: ores-chat-api-server.rs
        shell: bash
        run: |
          set -euo pipefail
          rustup component add rustfmt clippy
          cargo fmt --all
          cargo check --all-targets --locked
          cargo clippy --all-targets --locked -- -D warnings
          cargo test --all-targets --locked
      - name: Prove generated transport evidence exists
        working-directory: ores-chat-api-server.rs
        shell: bash
        run: |
          set -euo pipefail
          test -f src/ores_api_lambda.rs
          find src -type f \( -name 'rpc.rs' -o -name 'route-map.json' -o -name 'route_map.json' \) -print
          grep -R -F 'ores_chat.public_chat' src
          grep -R -F '__ores_invoke_public_chat' src/graphql src/routes
          git diff --check
      - name: Write back only a fully proven API branch
        working-directory: ores-chat-api-server.rs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add Cargo.lock Cargo.toml src
          if ! git diff --cached --quiet; then
            git commit -m 'feat: generate API RPC Lambda and GraphQL transport spine'
            git push origin HEAD:chatgpt/api-transport-generation-20260922
          fi
      - name: Remove private Git rewrite
        if: ${{ always() }}
        shell: bash
        run: git config --global --unset-all url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf || true
