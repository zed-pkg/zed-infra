name: DEN-3938 ORM refactor rustfmt

on:
  push:
    branches:
      - test/den3938-orm-fmt2-20260922
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rustfmt:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: canonical-cloud/canonical-orm-core
          ref: DEN-3938/persistence-audit-hardening
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.ORE_SOURCE_PAT }}
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: "1.95.0"
          components: rustfmt
      - name: Apply only deterministic rustfmt changes
        env:
          SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${SOURCE_PAT:-}"
          test "$(git rev-parse HEAD)" = 72d7a765c69d9230dc645c2954cd4a94f792b583
          cargo +1.95.0 fmt --all
          git diff --check
          actual="$(git diff --name-only | sort)"
          expected="$(printf '%s\n' src/principal.rs src/quote_live_tests.rs src/quote_store.rs | sort)"
          test "$actual" = "$expected" || {
            echo 'unexpected rustfmt file set:' >&2
            printf '%s\n' "$actual" >&2
            exit 1
          }
          cargo +1.95.0 fmt --all -- --check
          git config user.name 'ORESoftware'
          git config user.email 'alex@oresoftware.com'
          git add src/principal.rs src/quote_live_tests.rs src/quote_store.rs
          git commit -m 'style: format DEN-3938 persistence refactor'
          askpass="$RUNNER_TEMP/den3938-write-askpass.sh"
          cat >"$askpass" <<'SH'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$SOURCE_PAT" ;;
            *) exit 1 ;;
          esac
          SH
          chmod 700 "$askpass"
          export GIT_ASKPASS="$askpass" GIT_TERMINAL_PROMPT=0
          git push https://github.com/canonical-cloud/canonical-orm-core.git HEAD:DEN-3938/persistence-audit-hardening
