name: ores-stack 275 exact-head certification

on:
  push:
    branches:
      - proof/ores-stack-275-rustfmt-writeback
  workflow_dispatch:

permissions:
  contents: read

jobs:
  certify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ORESoftware/ores-stack
          ref: feat/parallel-rpc-runtime-client-lane
          fetch-depth: 0
          persist-credentials: false
          token: ${{ secrets.ORE_SOURCE_PAT }}
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.88.0'
          components: rustfmt, clippy
      - name: Verify exact source head and merge base
        env:
          EXPECTED_HEAD: f8acb2d1a473864746ae915790516257c7490544
          EXPECTED_MAIN: 253382da3634ce9fde62704e79e42160cee66838
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          git merge-base --is-ancestor "$EXPECTED_MAIN" "$EXPECTED_HEAD"
          test "$(git diff --name-only "$EXPECTED_MAIN"..."$EXPECTED_HEAD" | sort | tr '\n' ' ')" = "crates/ores-stack-cli/src/legacy/mod.rs crates/ores-stack-core/src/lib.rs crates/ores-stack-core/src/rpc_http_client_lane.rs crates/ores-stack-core/src/rpc_http_client_lane_post.rs "
      - name: Rustfmt and diff hygiene
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          git diff --check
          test -z "$(git status --porcelain)"
      - name: Frozen lock metadata
        shell: bash
        run: cargo metadata --locked --format-version 1 --no-deps >/dev/null
      - name: Compile affected crates
        shell: bash
        run: cargo check --locked -p ores-stack-core -p ores-stack-cli --all-targets
      - name: Focused parallel-lane tests
        shell: bash
        run: cargo test --locked -p ores-stack-core rpc_http_client_lane -- --nocapture
      - name: Strict clippy on affected crates
        shell: bash
        run: cargo clippy --locked -p ores-stack-core -p ores-stack-cli --all-targets -- -D warnings
      - name: Verify additive lane and terminal contract
        shell: bash
        run: |
          set -euo pipefail
          file=crates/ores-stack-core/src/rpc_http_client_lane.rs
          cli=crates/ores-stack-cli/src/legacy/mod.rs
          lib=crates/ores-stack-core/src/lib.rs
          grep -q '@oresoftware/ores-http-clients/fluent' "$file"
          grep -q 'package:ores_http_clients/ores_http_clients.dart' "$file"
          grep -q 'ores_http_clients' "$file"
          grep -q 'ores_http_clients/fluent' "$file"
          grep -q 'generated_ores_http' "$file"
          grep -q 'ORESoftware/ores-interfaces/contracts/rpc-client-call/v1' "$file"
          grep -q 'sync_import_aliases as sync_rpc_client_import_aliases' "$lib"
          grep -q 'materialize_from_canonical_sync' "$lib"
          grep -q 'sync_rpc_client_import_aliases' "$cli"
          grep -q 'makeCall' "$file"
          grep -q 'make_call' "$file"
          grep -q 'doStream' "$file"
          grep -q 'do_stream' "$file"
          ! grep -Eq '\.stream\(\)|\.stream\(' "$file"
          test -z "$(git status --porcelain)"
