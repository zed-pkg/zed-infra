name: prove ores-stack 279
on:
  push:
    branches: [proof/ores-stack-279-ppr-20260923]
permissions:
  contents: read
jobs:
  compile-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Require source PAT without exposing it
        env:
          SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          test -n "${SOURCE_PAT:-}" || { echo '::error::ORE_SOURCE_PAT is not configured'; exit 1; }
      - name: Check out exact ores-stack head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ORESoftware/ores-stack
          ref: 75e3eb1229f8b35dc6d987433e22bc7d7937025b
          fetch-depth: 1
          persist-credentials: false
          token: ${{ secrets.ORE_SOURCE_PAT }}
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.88.0'
          components: rustfmt,clippy
      - name: Install private git auth for Cargo
        env:
          SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        shell: bash
        run: |
          set -euo pipefail
          askpass="$RUNNER_TEMP/ores-stack-askpass.sh"
          cat >"$askpass" <<'SH'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$SOURCE_PAT" ;;
            *) exit 1 ;;
          esac
          SH
          chmod 700 "$askpass"
          echo "GIT_ASKPASS=$askpass" >> "$GITHUB_ENV"
          echo 'GIT_TERMINAL_PROMPT=0' >> "$GITHUB_ENV"
          echo 'CARGO_NET_GIT_FETCH_WITH_CLI=true' >> "$GITHUB_ENV"
      - run: cargo +1.88.0 fmt --all -- --check
      - run: cargo +1.88.0 check --locked -p ores-stack-cli --all-targets
      - run: cargo +1.88.0 test --locked -p ores-stack-cli
      - run: cargo +1.88.0 test --locked -p ores-stack-ppr-http
      - run: cargo +1.88.0 test --locked -p ores-stack-p2-edge-minimal
      - run: cargo +1.88.0 test --locked -p ores-stack-process-tree
      - run: cargo +1.88.0 test --locked -p ores-stack-core
