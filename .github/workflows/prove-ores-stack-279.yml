name: format ores-stack 279
on:
  push:
    branches: [proof/ores-stack-279-ppr-20260923]
permissions:
  contents: read
jobs:
  format-target:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Require source PAT without exposing it
        env:
          SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          test -n "${SOURCE_PAT:-}" || { echo '::error::ORE_SOURCE_PAT is not configured'; exit 1; }
      - name: Check out ores-stack PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ORESoftware/ores-stack
          ref: feat/stack-dev-build-deploy-ppr-20260923
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.ORE_SOURCE_PAT }}
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.88.0'
          components: rustfmt
      - name: Canonically format and push only formatting
        shell: bash
        run: |
          set -euo pipefail
          before="$(git rev-parse HEAD)"
          test "$before" = '75e3eb1229f8b35dc6d987433e22bc7d7937025b'
          cargo +1.88.0 fmt --all
          if git diff --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git diff --check
          git config user.name 'Alexander Mills'
          git config user.email 'alex@oresoftware.com'
          git add --update
          git commit -m 'style: rustfmt PPR dev orchestration'
          git push origin HEAD:feat/stack-dev-build-deploy-ppr-20260923
# trigger via contents API so GitHub emits the push event
