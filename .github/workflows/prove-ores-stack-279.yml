name: sync ores-stack 279 lock
on:
  push:
    branches: [proof/ores-stack-279-ppr-20260923]
permissions:
  contents: read
jobs:
  sync-lock:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
    steps:
      - name: Require source PAT without exposing it
        run: |
          set -euo pipefail
          test -n "${SOURCE_PAT:-}" || { echo '::error::ORE_SOURCE_PAT is not configured'; exit 1; }
      - name: Check out ores-stack PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ORESoftware/ores-stack
          ref: feat/stack-dev-build-deploy-ppr-20260923
          fetch-depth: 0
          persist-credentials: true
          token: ${{ secrets.ORE_SOURCE_PAT }}
      - uses: dtolnay/rust-toolchain@4be7066ada62dd38de10e7b70166bc74ed198c30
        with:
          toolchain: '1.88.0'
      - name: Install private git auth for Cargo
        shell: bash
        run: |
          set -euo pipefail
          askpass="$RUNNER_TEMP/ores-stack-askpass.sh"
          cat >"$askpass" <<'SH'
          #!/bin/sh
          case "$1" in
            *Username*) printf '%s\n' 'x-access-token' ;;
            *Password*) printf '%s\n' "$SOURCE_PAT" ;;
            *) exit 1 ;;
          esac
          SH
          chmod 700 "$askpass"
          printf 'GIT_ASKPASS=%s\nGIT_TERMINAL_PROMPT=0\nCARGO_NET_GIT_FETCH_WITH_CLI=true\n' "$askpass" >> "$GITHUB_ENV"
      - name: Refresh only dependency lock resolution and push
        shell: bash
        run: |
          set -euo pipefail
          before="$(git rev-parse HEAD)"
          test "$before" = 'c1785f37fe4bb620a033d1b121f46fde61c186df'
          cargo +1.88.0 metadata --format-version=1 >/dev/null
          git diff --check
          changed="$(git status --porcelain=v1)"
          printf '%s\n' "$changed"
          test -n "$changed" || { echo '::error::expected Cargo.lock to change'; exit 1; }
          test "$(printf '%s\n' "$changed" | wc -l)" -eq 1
          printf '%s\n' "$changed" | grep -Eq '^ M Cargo\.lock$|^M  Cargo\.lock$'
          git config user.name 'Alexander Mills'
          git config user.email 'alex@oresoftware.com'
          git add Cargo.lock
          git commit -m 'chore: refresh lockfile for stack orchestration'
          git push origin HEAD:feat/stack-dev-build-deploy-ppr-20260923
