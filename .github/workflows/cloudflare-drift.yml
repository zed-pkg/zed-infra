name: cloudflare drift

# The repo is the source of truth for the zpkg.net zone. This compares the
# live zone against terraform/cloudflare/main.tf (state-free — see
# scripts/check-cloudflare-drift.sh) and fails on any divergence.
#
# Requires repo secret CLOUDFLARE_DNS_READ_TOKEN (Zone:DNS:Read on zpkg.net
# only) and repo variable ZPKG_NET_ZONE_ID. Until both exist the job
# reports "not configured" and succeeds, so forks and pre-cutover PRs stay
# green.

on:
  pull_request:
    paths:
      - 'terraform/cloudflare/**'
      - 'scripts/check-cloudflare-drift.sh'
      - '.github/workflows/cloudflare-drift.yml'
  schedule:
    - cron: '17 6 * * 1' # weekly, Monday 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_DNS_READ_TOKEN }}
      ZPKG_NET_ZONE_ID: ${{ vars.ZPKG_NET_ZONE_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Compare live zone with repo
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN}" ] || [ -z "${ZPKG_NET_ZONE_ID}" ]; then
            echo "CLOUDFLARE_DNS_READ_TOKEN / ZPKG_NET_ZONE_ID not configured; skipping drift check"
            exit 0
          fi
          bash scripts/check-cloudflare-drift.sh
