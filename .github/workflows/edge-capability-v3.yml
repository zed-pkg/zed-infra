name: Edge capability v3 outage admission

on:
  pull_request:
    paths:
      - "workers/shared/edge-capability.js"
      - "workers/shared/edge-capability.test.js"
      - "workers/shared/provider-credential-broker.js"
      - "workers/shared/provider-credential-broker.test.js"
      - ".github/workflows/edge-capability-v3.yml"
  push:
    branches: [main]
    paths:
      - "workers/shared/edge-capability.js"
      - "workers/shared/edge-capability.test.js"
      - "workers/shared/provider-credential-broker.js"
      - "workers/shared/provider-credential-broker.test.js"
      - ".github/workflows/edge-capability-v3.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edge-capability-v3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-v3:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact source head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
          show-progress: false

      - name: Verify exact source revision
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Set up bounded Node runtime
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: "24.19.0"

      - name: Syntax-check verifier and credential broker
        run: |
          node --check workers/shared/edge-capability.js
          node --check workers/shared/provider-credential-broker.js

      - name: Execute v1/v2/v3 verifier and broker downgrade regressions
        run: |
          node --test workers/shared/edge-capability.test.js
          node --test workers/shared/provider-credential-broker.test.js
