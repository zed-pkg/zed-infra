name: ores-stack PPR hardening patch

on:
  push:
    branches:
      - ops/ores-stack-ppr-hardening-20260921
    paths:
      - .github/workflows/ores-stack-ppr-hardening.yml

permissions:
  contents: read

concurrency:
  group: ores-stack-ppr-hardening
  cancel-in-progress: false

jobs:
  patch-test-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      TARGET_REPO: ORESoftware/ores-stack
      TARGET_BRANCH: feat/ppr-server-stream-current-main-20260921
      EXPECTED_HEAD: 245a95c3f044f14b230b8558cbf065312b263eb5
      EXPECTED_SUPERVISOR_BLOB: 7f220b07102179e82a4d4ec1c6e61140f8cbc120
      CARGO_NET_GIT_FETCH_WITH_CLI: "true"
    steps:
      - name: Require cross-repository write credential
        shell: bash
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          test -n "${ORE_SOURCE_PAT:-}" || { echo 'ORE_SOURCE_PAT is not configured'; exit 2; }

      - name: Check out exact ores-stack branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.TARGET_REPO }}
          ref: ${{ env.TARGET_BRANCH }}
          token: ${{ secrets.ORE_SOURCE_PAT }}
          fetch-depth: 0
          persist-credentials: true
          show-progress: false

      - name: Refuse branch drift
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git hash-object crates/ores-stack-cli/src/ppr_supervisor.rs)" = "$EXPECTED_SUPERVISOR_BLOB"
          git diff --exit-code

      - name: Apply exact PPR process-tree and deadline patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, zlib
          payload = ''''''
          patch = zlib.decompress(base64.b64decode(payload))
          open('/tmp/ppr.patch', 'wb').write(patch)
          PY
          git apply --check /tmp/ppr.patch
          git apply /tmp/ppr.patch
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/ores-stack-cli/Cargo.toml')
          text = path.read_text()
          assert 'command-group' not in text
          marker = '[dependencies]\n'
          assert text.count(marker) == 1
          path.write_text(text.replace(marker, marker + 'command-group = "=5.0.1"\n', 1))
          PY
          git diff --check

      - name: Use Rust 1.88 with rustfmt
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.88.0 --profile minimal --component rustfmt
          rustup override set 1.88.0
          rustc --version
          cargo --version

      - name: Authenticate Cargo git dependencies
        shell: bash
        env:
          ORE_SOURCE_PAT: ${{ secrets.ORE_SOURCE_PAT }}
        run: |
          set -euo pipefail
          git config --global url."https://x-access-token:${ORE_SOURCE_PAT}@github.com/".insteadOf "https://github.com/"

      - name: Format and test supervisor
        shell: bash
        run: |
          set -euo pipefail
          cargo fmt --all
          git diff --check
          cargo test -p ores-stack-cli ppr_supervisor -- --nocapture
          if ! git ls-files --error-unmatch Cargo.lock >/dev/null 2>&1; then rm -f Cargo.lock; fi
          changed="$(git status --porcelain | awk '{print $2}' | sort)"
          expected=$'crates/ores-stack-cli/Cargo.toml\ncrates/ores-stack-cli/src/ppr_supervisor.rs'
          test "$changed" = "$expected" || { echo "unexpected changed files:"; git status --short; exit 3; }

      - name: Commit verified patch back to #162 branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'ORESoftware'
          git config user.email 'alexander.d.mills@gmail.com'
          git add crates/ores-stack-cli/Cargo.toml crates/ores-stack-cli/src/ppr_supervisor.rs
          git diff --cached --check
          git commit -m 'fix(ppr): own request process tree and finalization deadline'
          git push origin "HEAD:${TARGET_BRANCH}"
          echo "pushed $(git rev-parse HEAD) to ${TARGET_REPO}:${TARGET_BRANCH}"
