name: dual cloud contract

on:
  pull_request:
    paths:
      - '.github/workflows/deploy-zed-cloud.yml'
      - '.github/workflows/dual-cloud-contract.yml'
      - 'scripts/zed-cloud-preflight.sh'
      - 'scripts/resolve-zed-images.sh'
      - 'scripts/test-resolve-zed-images.sh'
      - 'k8s/bootstrap/**'
      - 'docs/dual-cloud-bootstrap.md'
  push:
    branches: [main]
    paths:
      - '.github/workflows/deploy-zed-cloud.yml'
      - '.github/workflows/dual-cloud-contract.yml'
      - 'scripts/zed-cloud-preflight.sh'
      - 'scripts/resolve-zed-images.sh'
      - 'scripts/test-resolve-zed-images.sh'
      - 'k8s/bootstrap/**'
      - 'docs/dual-cloud-bootstrap.md'
  workflow_dispatch:

permissions:
  contents: read

env:
  K8S_CLUSTER_REF: 41052d99d331c23da15b692e58edc5ba102d84ee
  ZED_API_REF: 3d2d4c98024e5bf718dc79c2648bd10d7759a31c
  ZED_WEB_REF: 75f5ac4e35e121485af75588ce453f350e0cabbc

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout deployment controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: zed-infra
          persist-credentials: false

      - name: Checkout pinned cluster tenancy
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ORESoftware/k8s-cluster
          ref: ${{ env.K8S_CLUSTER_REF }}
          path: k8s-cluster
          persist-credentials: false

      - name: Checkout pinned registry API manifests
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: zed-pkg/zed-api-server.rs
          ref: ${{ env.ZED_API_REF }}
          path: zed-api-server.rs
          persist-credentials: false

      - name: Checkout pinned registry web manifests
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: zed-pkg/zed-web-server.rs
          ref: ${{ env.ZED_WEB_REF }}
          path: zed-web-server.rs
          persist-credentials: false

      - name: Verify pinned source identities
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C k8s-cluster rev-parse HEAD)" = "$K8S_CLUSTER_REF"
          test "$(git -C zed-api-server.rs rev-parse HEAD)" = "$ZED_API_REF"
          test "$(git -C zed-web-server.rs rev-parse HEAD)" = "$ZED_WEB_REF"

      - name: Exercise credential and immutable-image contracts
        working-directory: zed-infra
        run: |
          bash scripts/test-zed-cloud-preflight.sh
          bash scripts/test-resolve-zed-images.sh

      - name: Render both application stacks
        shell: bash
        run: |
          set -euo pipefail
          for cloud in aws hetzner; do
            kubectl kustomize "zed-api-server.rs/k8s/overlays/$cloud" > "/tmp/api-$cloud.yaml"
            kubectl kustomize "zed-web-server.rs/k8s/overlays/$cloud" > "/tmp/web-$cloud.yaml"
          done

      - name: Verify volatile storage and fail-closed API ownership
        shell: bash
        run: |
          set -euo pipefail
          tenant=k8s-cluster/remote/argocd/projects/zed.tenant.yaml
          project=k8s-cluster/remote/argocd/projects/zed.appproject.yaml
          postgres=zed-infra/k8s/bootstrap/zed-postgres-pgvector.yaml
          grep -q 'name: zed' "$tenant"
          grep -q 'podSelector: {}' "$tenant"
          grep -q 'clusterResourceWhitelist: \[\]' "$project"
          grep -q 'image: pgvector/pgvector:0.8.5-pg16' "$postgres"
          grep -q 'medium: Memory' "$postgres"
          grep -q 'sizeLimit: 512Mi' "$postgres"
          grep -q 'replicas: 1' "$postgres"

          for cloud in aws hetzner; do
            api="/tmp/api-$cloud.yaml"
            web="/tmp/web-$cloud.yaml"
            grep -q 'replicas: 1' "$api"
            grep -q 'type: Recreate' "$api"
            grep -q 'name: STORAGE_BACKEND' "$api"
            grep -q 'value: memory' "$api"
            grep -q 'name: STORAGE_MEMORY_MAX_BYTES' "$api"
            grep -q 'value: "268435456"' "$api"
            grep -q 'name: MAX_ARTIFACT_BYTES' "$api"
            grep -q 'value: "104857600"' "$api"
            ! grep -q 'medium: Memory' "$api"
            ! grep -Eq 'mountPath: .*(artifact|/var/lib/zed)' "$api"
            ! grep -Eq 'name: (artifact|artifacts|artifact-store)$' "$api"
            grep -q 'name: ZED_AUTH_DISABLED' "$api"
            grep -q 'name: ZED_RATE_LIMIT_DISABLED' "$api"
            grep -q 'name: ZED_VERIFY_TAGS' "$api"
            ! grep -q '^kind: Ingress$' "$api"
            ! grep -q 'kubernetes.io/metadata.name: ingress-nginx' "$api"
            ! grep -q 'cidr: 0.0.0.0/0' "$api"
            ! grep -q 'port: 443' "$api"
            ! grep -q 'port: 6543' "$api"
            grep -q 'replicas: 2' "$web"
            grep -q "registry.$cloud.zpkg.tech" "$web"
          done
          grep -q 'host: aws.zpkg.tech' /tmp/web-aws.yaml
          grep -q 'host: hetzner.zpkg.tech' /tmp/web-hetzner.yaml

      - name: Ratchet three-digest deployment and package certification
        shell: bash
        working-directory: zed-infra
        run: |
          set -euo pipefail
          workflow=.github/workflows/deploy-zed-cloud.yml
          grep -q 'cloud: \[aws, hetzner\]' "$workflow"
          # Escaped braces on purpose: GitHub expands expressions inside a
          # run: block before the shell sees it — even in comments — and this
          # job has no matrix. Written literally, the pattern rendered as
          # "environment: " and the ratchet asserted almost nothing. The
          # escaped form below is not an expression start, so the real pinned
          # value is what gets checked.
          grep -Eq 'environment: \$\{\{ matrix\.cloud \}\}' "$workflow"
          grep -q 'timeout-minutes: 75' "$workflow"
          grep -q "K8S_CLUSTER_REF: $K8S_CLUSTER_REF" "$workflow"
          grep -q "ZED_API_REF: $ZED_API_REF" "$workflow"
          grep -q "ZED_WEB_REF: $ZED_WEB_REF" "$workflow"
          grep -q 'ZED_CLI_REF: 8929a58c6591c7a964d7f91412665d7c8a4afdf3' "$workflow"
          grep -q 'ZED_INTERFACES_REF: dc0e0a0620b9462817950b552d3d334a184b1cb1' "$workflow"
          grep -q 'zed-cloud-preflight.sh' "$workflow"
          grep -q 'resolve-zed-images.sh' "$workflow"
          grep -q 'ZED_PREFLIGHT_KEEP_KUBECONFIG' "$workflow"
          grep -q 'ZED_API_IMAGE' "$workflow"
          grep -q 'ZED_WEB_IMAGE' "$workflow"
          grep -q 'ZED_POSTGRES_IMAGE' "$workflow"
          grep -q 'postgres-rendered.yaml' "$workflow"
          grep -q 'delete ingress dd-zed-api-server --ignore-not-found=true' "$workflow"
          grep -q 'type: Recreate' "$workflow"
          grep -q 'install --install-mode copy' "$workflow"
          grep -q 'install --frozen --install-mode copy' "$workflow"
          grep -q 'cmp "$evidence/first.lock"' "$workflow"
          grep -q 'runtime-images.txt' "$workflow"
          grep -q 'process-memory.json' "$workflow"
          grep -q "'STORAGE_BACKEND': 'memory'" "$workflow"
          grep -q "'STORAGE_MEMORY_MAX_BYTES': '268435456'" "$workflow"
          grep -q "'MAX_ARTIFACT_BYTES': '104857600'" "$workflow"
          grep -q 'artifact bytes must remain in Rust process memory' "$workflow"
          grep -q 'Verify evidence contains no protected values' "$workflow"
          grep -q 'rm -f "$KUBECONFIG"' "$workflow"
          grep -q 'rm -rf "$ZED_PKG_HOME"' "$workflow"
          ! grep -q 'kubectl apply -k' "$workflow"
          ! grep -Eq 'uses: [^[:space:]]+@(main|master|v[0-9]+|stable|latest)$' "$workflow"

          python3 - "$workflow" <<'PY'
          import pathlib, sys
          text = pathlib.Path(sys.argv[1]).read_text(encoding='utf-8')
          order = [
              'Fail fast on credentials, deployment RBAC, and package access',
              'Resolve and attest immutable deployment image digests',
              'Build the pinned Zed CLI',
              'Apply tenant and AppProject boundaries',
              'Apply and reset digest-pinned RAM-backed pgvector',
              'Render and apply exact API and web image digests',
              'Publish, install, erase, and frozen-reinstall through the live Service',
              'Verify evidence contains no protected values',
              'Scrub decoded and downloaded credentials',
          ]
          positions = [text.index(item) for item in order]
          if positions != sorted(positions):
              raise SystemExit(f'unsafe workflow order: {list(zip(order, positions))}')
          PY
