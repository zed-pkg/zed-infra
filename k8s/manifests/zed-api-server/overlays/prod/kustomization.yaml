apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: zed
resources:
  - ../../base

# Pin the deployed revision by DIGEST here. The base tracks the mutable `main`
# tag (fine for dev), but prod should deploy a declared, reviewable, and
# rollback-able revision — a digest is the only identifier a registry cannot
# re-point. Uncomment and let CI bump `digest` on release:
#
# images:
#   - name: ghcr.io/zed-pkg/zed-api-server
#     digest: sha256:<image digest published by the release workflow>
#
# Until that is wired up the base's imagePullPolicy: Always at least keeps all
# replicas converged on the same current `main` build.
patches:
  - target:
      kind: Deployment
      name: zed-api-server
    patch: |
      - op: replace
        path: /spec/replicas
        value: 3
