apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: zed-api-server
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts: [api.zpkg.net, registry.zpkg.net]
      secretName: zed-api-server-tls
  rules:
    - host: api.zpkg.net
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: zed-api-server
                port:
                  number: 80
    - host: registry.zpkg.net
      http:
        paths:
          - path: /healthz
            pathType: Exact
            backend:
              service:
                name: zed-api-server
                port:
                  number: 80
          - path: /v1
            pathType: Prefix
            backend:
              service:
                name: zed-api-server
                port:
                  number: 80
