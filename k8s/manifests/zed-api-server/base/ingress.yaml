apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: zed-api-server
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: nginx
  tls:
    - hosts: [registry.zpkg.tech]
      secretName: zed-api-server-tls
  rules:
    - host: registry.zpkg.tech
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: zed-api-server
                port:
                  number: 80
