apiVersion: v1
kind: ConfigMap
metadata:
  name: zed-api-server-config
data:
  BIND_ADDR: "0.0.0.0:8080"
  STORAGE_BACKEND: "s3"
  S3_BUCKET: "zed-pkg-artifacts"
  # Cloudflare R2 endpoint; see zed-infra/terraform/cloudflare outputs.
  S3_ENDPOINT_URL: "https://REPLACE-ME-account-id.r2.cloudflarestorage.com"
  S3_REGION: "auto"
  S3_FORCE_PATH_STYLE: "true"
  PUBLIC_BASE_URL: "https://registry.zpkg.net"
  ZED_VERIFY_TAGS: "github"
  RUST_LOG: "info"
