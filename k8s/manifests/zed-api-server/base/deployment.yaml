apiVersion: apps/v1
kind: Deployment
metadata:
  name: zed-api-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: zed-api-server
  template:
    metadata:
      labels:
        app: zed-api-server
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: zed-api-server
          image: ghcr.io/zed-pkg/zed-api-server:v0.1.0
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: zed-api-server-config
            - secretRef:
                name: zed-api-server-secrets
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: "1"
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
