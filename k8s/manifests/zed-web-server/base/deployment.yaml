apiVersion: apps/v1
kind: Deployment
metadata:
  name: zed-web-server
spec:
  replicas: 2
  selector:
    matchLabels:
      app: zed-web-server
  template:
    metadata:
      labels:
        app: zed-web-server
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
      containers:
        - name: zed-web-server
          image: ghcr.io/zed-pkg/zed-web-server:v0.1.0
          ports:
            - containerPort: 8081
          envFrom:
            - configMapRef:
                name: zed-web-server-config
            - secretRef:
                name: zed-web-server-secrets
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 3
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
