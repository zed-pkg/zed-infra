# TEMPORARY disposable metadata store for the Zed registry.
#
# The registry migration m20260726_000007_embeddings_and_tags creates the
# `vector` extension, so the bootstrap database must provide pgvector rather
# than plain PostgreSQL. Data remains pod-local and memory-backed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zed-postgres
  namespace: zed
  labels:
    app: zed-postgres
    app.kubernetes.io/name: zed-postgres
    app.kubernetes.io/part-of: zed
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: zed-postgres
  template:
    metadata:
      labels:
        app: zed-postgres
        app.kubernetes.io/name: zed-postgres
        app.kubernetes.io/part-of: zed
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: postgres
          image: pgvector/pgvector:0.8.5-pg16
          imagePullPolicy: IfNotPresent
          ports:
            - { name: postgres, containerPort: 5432 }
          env:
            - { name: POSTGRES_USER, value: zed }
            - { name: POSTGRES_DB, value: zed }
            - { name: POSTGRES_HOST_AUTH_METHOD, value: trust }
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
          readinessProbe:
            exec:
              command: [pg_isready, -U, zed, -d, zed]
            initialDelaySeconds: 3
            periodSeconds: 3
            timeoutSeconds: 3
            failureThreshold: 20
          livenessProbe:
            exec:
              command: [pg_isready, -U, zed, -d, zed]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 1, memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
      volumes:
        - name: data
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: zed-postgres
  namespace: zed
  labels:
    app: zed-postgres
    app.kubernetes.io/part-of: zed
spec:
  selector:
    app: zed-postgres
  ports:
    - { name: postgres, port: 5432, targetPort: postgres }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: zed-postgres
  namespace: zed
spec:
  podSelector:
    matchLabels:
      app: zed-postgres
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchExpressions:
              - key: app
                operator: In
                values: [dd-zed-api-server, dd-zed-web-server]
      ports:
        - { protocol: TCP, port: 5432 }
