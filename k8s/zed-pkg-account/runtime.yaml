apiVersion: v1
kind: Namespace
metadata:
  name: zed-pkg
  labels:
    app.kubernetes.io/part-of: zed-pkg
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: zed-api-server
  namespace: zed-pkg
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: zed-web-server
  namespace: zed-pkg
automountServiceAccountToken: false
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: zed-pkg-runtime
  namespace: zed-pkg
data:
  AUTO_MIGRATE: "false"
  BIND_ADDR: "0.0.0.0:8080"
  DB_CONNECT_MAX_WAIT_SECS: "60"
  SHARED_AUTH_AUDIENCE: "zed-pkg"
  SHARED_AUTH_APPLICATION_ID: "zpkg-web"
  SHARED_AUTH_HANDOFF_CLIENT_ID: "zpkg"
  SHARED_AUTH_DELEGATE_CLIENT_ID: "zpkg-web"
  SHARED_AUTH_SCOPES: "zpkg:account"
  ZED_API_URL: "http://zed-api-server.zed-pkg.svc.cluster.local:8080"
  COOKIE_SECURE: "true"
  RUST_LOG: "info,tower_http=info"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: zed-pkg-registry-migrate
  namespace: zed-pkg
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "-10"
  labels:
    app.kubernetes.io/name: zed-pkg-registry-migrate
    app.kubernetes.io/part-of: zed-pkg
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zed-pkg-registry-migrate
        app.kubernetes.io/part-of: zed-pkg
    spec:
      restartPolicy: Never
      serviceAccountName: zed-api-server
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          # The cluster overlay MUST replace this tag with the same immutable
          # digest used by the API Deployment.
          image: ghcr.io/zed-pkg/zed-api-server.rs:replace-with-git-sha
          imagePullPolicy: IfNotPresent
          args: ["migrate"]
          envFrom:
            - configMapRef:
                name: zed-pkg-runtime
            - secretRef:
                name: zed-pkg-registry-db
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zed-api-server
  namespace: zed-pkg
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    app.kubernetes.io/name: zed-api-server
    app.kubernetes.io/part-of: zed-pkg
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: zed-api-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zed-api-server
        app.kubernetes.io/part-of: zed-pkg
    spec:
      serviceAccountName: zed-api-server
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          image: ghcr.io/zed-pkg/zed-api-server.rs:replace-with-git-sha
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: zed-pkg-runtime
            - secretRef:
                name: zed-pkg-registry-db
            - secretRef:
                name: zed-pkg-shared-auth
            - secretRef:
                name: zed-pkg-artifact-storage
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: "1"
              memory: 768Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: zed-api-server
  namespace: zed-pkg
  labels:
    app.kubernetes.io/name: zed-api-server
spec:
  selector:
    app.kubernetes.io/name: zed-api-server
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: zed-web-server
  namespace: zed-pkg
  annotations:
    argocd.argoproj.io/sync-wave: "10"
  labels:
    app.kubernetes.io/name: zed-web-server
    app.kubernetes.io/part-of: zed-pkg
spec:
  replicas: 2
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: zed-web-server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: zed-web-server
        app.kubernetes.io/part-of: zed-pkg
    spec:
      serviceAccountName: zed-web-server
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: ghcr.io/zed-pkg/zed-web-server.rs:replace-with-git-sha
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: zed-pkg-runtime
            - secretRef:
                name: zed-pkg-shared-auth
            - secretRef:
                name: zed-pkg-web-auth
            - secretRef:
                name: zed-pkg-web-runtime
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 384Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            readOnlyRootFilesystem: true
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: zed-web-server
  namespace: zed-pkg
  labels:
    app.kubernetes.io/name: zed-web-server
spec:
  selector:
    app.kubernetes.io/name: zed-web-server
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: zed-api-server
  namespace: zed-pkg
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: zed-api-server
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: zed-web-server
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 5432
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: zed-web-server
  namespace: zed-pkg
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: zed-web-server
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: zed-api-server
      ports:
        - protocol: TCP
          port: 8080
    - ports:
        - protocol: TCP
          port: 443
