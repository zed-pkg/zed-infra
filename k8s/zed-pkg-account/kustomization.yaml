apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - runtime.yaml

commonLabels:
  app.kubernetes.io/managed-by: argocd

# Release overlays must replace both candidate tags with immutable image
# digests. The migration Job and API Deployment must use the same digest.
images:
  - name: ghcr.io/zed-pkg/zed-api-server.rs
    newTag: replace-with-git-sha
  - name: ghcr.io/zed-pkg/zed-web-server.rs
    newTag: replace-with-git-sha
