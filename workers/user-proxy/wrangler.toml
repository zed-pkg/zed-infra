name = "zpkg-user-proxy"
main = "src/index.js"
compatibility_date = "2026-08-28"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

# user.zpkg.net → zed-web-server.rs on the k8s cluster.

[vars]
ORIGIN_TIMEOUT_MS = "8000"

[observability]
enabled = true
head_sampling_rate = 1
redact_query_string = true

[[routes]]
pattern = "user.zpkg.net/*"
zone_name = "zpkg.net"
