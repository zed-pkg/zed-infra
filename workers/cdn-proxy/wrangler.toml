# Public read-only Worker over the private production bucket. The existing
# proxied cdn.zpkg.net CNAME stays in DNS and a zone Worker Route intercepts
# every path before that fallback origin. workers.dev deliberately remains
# enabled as a zone-independent emergency hostname.

name = "zpkg-cdn"
main = "src/index.js"
compatibility_date = "2026-08-28"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[[r2_buckets]]
binding = "ARTIFACTS"
bucket_name = "zed-pkg-artifacts"

[vars]
REGISTRY_URL = "https://registry.zpkg.net"
FALLBACK_TIMEOUT_MS = "5000"
MIRRORS = '''[
  {
    "kind": "object-store",
    "id": "zpkg-cdn",
    "url": "https://cdn.zpkg.net",
    "alternate_urls": ["https://zpkg-cdn.alexander-d-mills.workers.dev"],
    "priority": 20
  },
  {
    "kind": "zed-registry",
    "id": "zpkg-registry",
    "url": "https://registry.zpkg.net",
    "priority": 0
  }
]'''

[observability]
enabled = true

[[routes]]
pattern = "cdn.zpkg.net/*"
zone_name = "zpkg.net"

[env.dev]
name = "zpkg-cdn-dev"
workers_dev = true

[[env.dev.r2_buckets]]
binding = "ARTIFACTS"
bucket_name = "zed-pkg-artifacts-dev"

[env.dev.vars]
REGISTRY_URL = "http://localhost:8080"
FALLBACK_TIMEOUT_MS = "5000"
MIRRORS = "[]"
