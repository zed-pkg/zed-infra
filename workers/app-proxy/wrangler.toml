name = "zpkg-app-proxy"
main = "src/index.js"
compatibility_date = "2026-08-28"
compatibility_flags = ["nodejs_compat"]

# Signed-in package UI. Same origin as web.zpkg.net today; split later.

[vars]
ORIGIN_URL = "https://origin-hetzner.zpkg.net"
ORIGIN_TIMEOUT_MS = "8000"

[observability]
enabled = true

[[routes]]
pattern = "app.zpkg.net/*"
zone_name = "zpkg.net"
