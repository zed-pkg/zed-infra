name = "zpkg-registry-proxy"
main = "src/entry.js"
compatibility_date = "2026-08-28"
compatibility_flags = ["nodejs_compat"]
workers_dev = false

# Hostnames are the explicit machine-registry routes set of zed-api-server.rs.
# `zpkg.net/v1/*` is the canonical CLI/SDK entry point; the dedicated
# `registry.zpkg.net/*` hostname remains as a compatibility route. The Worker
# rejects account/auth/admin paths before origin I/O, including compatibility
# account routes that also happen to live below /v1.
# GitHub fallback is deliberately anonymous; do not attach a token that could
# make private repositories observable to this public edge.
# entry.js stamps every response with x-zed-edge: registry so outside-in
# attestations can distinguish this Worker from the Rust origin and generic
# Cloudflare error pages.

[vars]
ORIGIN_URL = "https://api.zpkg.net"
# Where published artifacts are advertised for download. The CDN Worker serves
# this bucket's content-addressed objects, so an install never depends on the
# registry host being reachable.
CDN_PUBLIC_URL = "https://cdn.zpkg.net"
ORIGIN_TIMEOUT_MS = "4000"
FALLBACK_TIMEOUT_MS = "4000"

# Publishing while no zed-api-server origin is running. The Worker writes the
# same content-addressed keys the CDN already serves, so nothing else has to
# change for a published package to be installable.
#
# The write path stays closed until an operator sets the publish secret. Set
# the EDGE_PUBLISH_TOKEN repository secret and the deploy workflow syncs it to
# this Worker; ZPKG_GITHUB_PACKAGES_TOKEN likewise enables the GHCR mirror.
# Without them the Worker keeps answering 503 for writes. The token authorizes
# publishing; it does not prove org ownership, which only the origin's account
# database can answer, so treat it as an operator credential and rotate it when
# the origin takes publishing back.
[[r2_buckets]]
binding = "ARTIFACTS"
bucket_name = "zed-pkg-artifacts"

[observability]
enabled = true
head_sampling_rate = 1
redact_query_string = true

# The registry consumes public, bounded GitHub release sidecars through the
# already-audited CDN Worker without making a recursive same-zone subrequest.
[[services]]
binding = "CDN"
service = "zpkg-cdn"

# Canonical client route. Keep this path-scoped so the zpkg.net website can
# continue to own non-registry paths on the apex hostname.
[[routes]]
pattern = "zpkg.net/v1/*"
zone_name = "zpkg.net"

# Legacy/dedicated machine hostname kept for compatibility with older clients.
[[routes]]
pattern = "registry.zpkg.net/*"
zone_name = "zpkg.net"
