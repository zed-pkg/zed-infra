name = "zpkg-registry-proxy"
main = "src/index.js"
compatibility_date = "2026-08-28"
compatibility_flags = ["nodejs_compat"]

# Hostname is the registry slice of zed-api-server.rs (/healthz + /v1 only).
# ORIGIN_URL is the cluster edge (same API process as api.zpkg.net).
# Read-only GitHub/native fallback when that origin is 5xx/timeout.
# Put the optional GitHub token with: wrangler secret put GITHUB_TOKEN

[vars]
ORIGIN_URL = "https://origin-hetzner.zpkg.net"
ORIGIN_TIMEOUT_MS = "4000"

[observability]
enabled = true

[[routes]]
pattern = "registry.zpkg.net/*"
zone_name = "zpkg.net"
